# Netlify Configuration for Shree Balaji Home Tiffin Services
# Single Page Application (React + Vite + Bootstrap)

[build]
  command = "npm run build"
  publish = "dist"

# Environment variables setup (if needed)
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA Fallback: Direct all routes to index.html for React client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets for fast global CDN loading
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
